<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">ITSdetector v2_dev post-DADA2 ITSx workflow</title>
  <desc id="desc">Cutadapt single-end and paired-end reads are denoised independently with DADA2, processed by ITSx, collapsed by identical extracted ITS sequence, and analyzed with phylogeny, UNITE taxonomy, and RefSeq ITS BLAST reconciliation.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#ea580c"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Arial, sans-serif; fill: #475569; }
      .stage { font: 700 13px Arial, sans-serif; letter-spacing: 1.2px; fill: #64748b; }
      .label { font: 700 18px Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .small { font: 400 14px Arial, sans-serif; fill: #475569; text-anchor: middle; }
      .tiny { font: 400 12px Arial, sans-serif; fill: #64748b; text-anchor: middle; }
      .pill { font: 700 12px Arial, sans-serif; fill: #ffffff; text-anchor: middle; }
      .box { stroke-width: 2; rx: 16; filter: url(#shadow); }
      .arrow { fill: none; stroke: #475569; stroke-width: 3; marker-end: url(#arrow); }
      .arrow-blue { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrowBlue); }
      .arrow-orange { fill: none; stroke: #ea580c; stroke-width: 3; marker-end: url(#arrowOrange); }
      .dash { fill: none; stroke: #94a3b8; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="1040" fill="#f8fafc"/>
  <rect x="34" y="26" width="1532" height="988" rx="26" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="70" y="78" class="title">ITSdetector v2_dev</text>
  <text x="70" y="108" class="subtitle">Cutadapt single + paired → DADA2 → ITSx → exact ITS sequence collapse</text>

  <rect x="1090" y="55" width="18" height="18" rx="5" fill="#dbeafe" stroke="#2563eb"/>
  <text x="1118" y="69" class="subtitle">single-end</text>
  <rect x="1245" y="55" width="18" height="18" rx="5" fill="#ffedd5" stroke="#ea580c"/>
  <text x="1273" y="69" class="subtitle">paired-end</text>
  <rect x="1405" y="55" width="18" height="18" rx="5" fill="#dcfce7" stroke="#16a34a"/>
  <text x="1433" y="69" class="subtitle">shared</text>

  <text x="70" y="158" class="stage">01 · INPUT &amp; CLEANUP</text>

  <rect x="70" y="180" width="220" height="105" class="box" fill="#f1f5f9" stroke="#64748b"/>
  <text x="180" y="219" class="label">Samplesheet</text>
  <text x="180" y="247" class="small">R1 / R2 FASTQ</text>
  <text x="180" y="268" class="tiny">VALIDATE_SAMPLESHEET</text>

  <rect x="360" y="180" width="250" height="105" class="box" fill="#f1f5f9" stroke="#64748b"/>
  <text x="485" y="215" class="label">Read cleanup</text>
  <text x="485" y="243" class="small">adapter · poly-G/A · quality</text>
  <text x="485" y="266" class="tiny">FastQC / MultiQC reports</text>

  <rect x="680" y="180" width="250" height="105" class="box" fill="#f1f5f9" stroke="#64748b"/>
  <text x="805" y="215" class="label">QIIME manifest</text>
  <text x="805" y="243" class="small">paired + R1 manifests</text>
  <text x="805" y="266" class="tiny">BUILD_QIIME_MANIFEST</text>

  <rect x="1000" y="180" width="250" height="105" class="box" fill="#f1f5f9" stroke="#64748b"/>
  <text x="1125" y="219" class="label">QIIME import</text>
  <text x="1125" y="247" class="small">demux PE + demux R1</text>
  <text x="1125" y="268" class="tiny">QIIME_IMPORT</text>

  <rect x="1320" y="180" width="210" height="105" class="box" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="1425" y="219" class="label">Preprocess</text>
  <text x="1425" y="247" class="small">primer trimming</text>
  <text x="1425" y="268" class="tiny">QIIME_PREPROCESS</text>

  <path d="M290 232 H350" class="arrow"/>
  <path d="M610 232 H670" class="arrow"/>
  <path d="M930 232 H990" class="arrow"/>
  <path d="M1250 232 H1310" class="arrow"/>

  <text x="70" y="345" class="stage">02 · CUTADAPT BRANCHES &amp; DENOISING</text>

  <path d="M1425 285 V325 H235 V370" class="arrow-blue"/>
  <path d="M1425 285 V325 H945 V370" class="arrow-orange"/>

  <rect x="90" y="370" width="290" height="100" class="box" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="110" y="386" width="72" height="24" rx="12" fill="#2563eb"/>
  <text x="146" y="403" class="pill">SINGLE</text>
  <text x="235" y="428" class="label">Cutadapt R1</text>
  <text x="235" y="453" class="small">forward primer removal</text>

  <rect x="430" y="370" width="260" height="100" class="box" fill="#dbeafe" stroke="#2563eb"/>
  <text x="560" y="412" class="label">DADA2 single</text>
  <text x="560" y="442" class="small">single-end ASVs</text>

  <rect x="800" y="370" width="290" height="100" class="box" fill="#ffedd5" stroke="#ea580c"/>
  <rect x="820" y="386" width="72" height="24" rx="12" fill="#ea580c"/>
  <text x="856" y="403" class="pill">PAIRED</text>
  <text x="945" y="428" class="label">Cutadapt R1 + R2</text>
  <text x="945" y="453" class="small">forward + reverse primers</text>

  <rect x="1140" y="370" width="260" height="100" class="box" fill="#ffedd5" stroke="#ea580c"/>
  <text x="1270" y="412" class="label">DADA2 paired</text>
  <text x="1270" y="442" class="small">denoise + merge ASVs</text>

  <path d="M380 420 H420" class="arrow-blue"/>
  <path d="M1090 420 H1130" class="arrow-orange"/>

  <rect x="585" y="520" width="430" height="85" class="box" fill="#f1f5f9" stroke="#64748b"/>
  <text x="800" y="552" class="label">Cutadapt DADA2 result channel</text>
  <text x="800" y="580" class="small">table.qza · repseq.qza · denoising stats</text>
  <path d="M560 470 V500 H700 V510" class="arrow-blue"/>
  <path d="M1270 470 V500 H900 V510" class="arrow-orange"/>

  <text x="70" y="660" class="stage">03 · POST-DADA2 ITS EXTRACTION &amp; COLLAPSE</text>

  <rect x="90" y="690" width="260" height="110" class="box" fill="#dcfce7" stroke="#16a34a"/>
  <text x="220" y="728" class="label">Export ASVs</text>
  <text x="220" y="755" class="small">BIOM + FASTA</text>
  <text x="220" y="780" class="tiny">QIIME_EXPORT_ASVS_FOR_ITSX</text>

  <rect x="410" y="690" width="260" height="110" class="box" fill="#dcfce7" stroke="#16a34a"/>
  <text x="540" y="728" class="label">ITSx extraction</text>
  <text x="540" y="755" class="small">taxa F · region ITS2</text>
  <text x="540" y="780" class="tiny">preserve original feature IDs</text>

  <rect x="730" y="690" width="300" height="110" class="box" fill="#dcfce7" stroke="#16a34a"/>
  <text x="880" y="722" class="label">Exact-sequence collapse</text>
  <text x="880" y="750" class="small">identical ITS2 → one feature</text>
  <text x="880" y="776" class="tiny">sum per-sample abundance</text>

  <rect x="1090" y="690" width="290" height="110" class="box" fill="#dcfce7" stroke="#16a34a"/>
  <text x="1235" y="722" class="label">Re-import &amp; validate</text>
  <text x="1235" y="750" class="small">collapsed table + repseq</text>
  <text x="1235" y="776" class="tiny">retention / mapping reports</text>

  <path d="M800 605 V650 H220 V680" class="arrow"/>
  <path d="M350 745 H400" class="arrow"/>
  <path d="M670 745 H720" class="arrow"/>
  <path d="M1030 745 H1080" class="arrow"/>

  <text x="70" y="865" class="stage">04 · DOWNSTREAM ANALYSIS</text>

  <rect x="120" y="890" width="310" height="95" class="box" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="275" y="925" class="label">Phylogeny · optional</text>
  <text x="275" y="954" class="small">MAFFT → mask → FastTree</text>

  <rect x="510" y="890" width="310" height="95" class="box" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="665" y="925" class="label">UNITE taxonomy</text>
  <text x="665" y="954" class="small">v10 · 99% classifier</text>

  <rect x="900" y="890" width="310" height="95" class="box" fill="#fef3c7" stroke="#d97706"/>
  <text x="1055" y="925" class="label">RefSeq ITS BLAST</text>
  <text x="1055" y="954" class="small">optional species rescue</text>

  <rect x="1290" y="890" width="220" height="95" class="box" fill="#f1f5f9" stroke="#334155"/>
  <text x="1400" y="925" class="label">Results</text>
  <text x="1400" y="954" class="small">artifacts + reports</text>

  <path d="M1235 800 V840 H275 V880" class="arrow"/>
  <path d="M1235 800 V840 H665 V880" class="arrow"/>
  <path d="M820 937 H890" class="arrow"/>
  <path d="M430 955 C760 1020,1120 1015,1280 955" class="dash"/>
  <path d="M1210 937 H1280" class="arrow"/>

  <rect x="70" y="304" width="760" height="28" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="5 4"/>
  <text x="450" y="323" class="tiny">Legacy ITSxpress preprocessing remains available; it bypasses post-DADA2 exact-sequence collapse.</text>
</svg>
